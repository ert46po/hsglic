<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HSGLIC - iOS & Web Edition</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00ff66;
            font-family: monospace;
            text-align: center;
            padding: 15px;
            margin: 0;
        }
        h2 { font-size: 16px; margin: 10px 0; color: #00ff66; text-shadow: 0 0 5px #00ff66; }
        .score-board {
            font-size: 14px;
            background: #111;
            border: 1px solid #333;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        #console {
            background-color: black;
            color: #00ff66;
            border: 2px solid #00ff66;
            width: 100%;
            max-width: 400px;
            height: 220px;
            margin: 0 auto 15px auto;
            padding: 10px;
            text-align: left;
            overflow-y: scroll;
            font-size: 12px;
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgba(0,255,102,0.2);
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
        }
        button {
            background-color: #1a1a1a;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 14px;
            font-family: monospace;
            font-weight: bold;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:active { background-color: #00ff66; color: black; }
    </style>
</head>
<body>

    <h2>⚡ HSGLIC [iOS Web 24/7] ⚡</h2>
    <div class="score-board">🔓 Hacked Targets: <span id="score">0</span></div>

    <div id="console">[*] iOS Secure Terminal Loaded...<br>[*] Progress is auto-saved in browser!<br><br></div>

    <div class="btn-grid">
        <button onclick="logAction('Connect')">🌐 Connect Target</button>
        <button onclick="logAction('Scan')">🔍 Scan Ports</button>
        <button onclick="logAction('Firewall')">🛡️ Bypass FW</button>
        <button onclick="logAction('Inject')">⚡ Inject Payload</button>
        <button onclick="clearScreen()" style="grid-column: span 2; border-color: #ff3333; color: #ff3333;">🧹 Clear Screen</button>
    </div>

    <script>
        let score = localStorage.getItem('hsglic_score') ? parseInt(localStorage.getItem('hsglic_score')) : 0;
        document.getElementById("score").innerText = score;

        const consoleBox = document.getElementById("console");

        function logAction(type) {
            let msg = "";
            if(type === 'Connect') {
                let ip = `192.168.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
                msg = "[+] Connected to target IP: " + ip;
            } else if(type === 'Scan') {
                msg = "[!] Port 443 OPEN and vulnerable.";
            } else if(type === 'Firewall') {
                msg = "[+] Firewall bypassed successfully!";
            } else if(type === 'Inject') {
                msg = "[SUCCESS] Rootkit payload injected!";
                score += 10;
                localStorage.setItem('hsglic_score', score);
                document.getElementById("score").innerText = score;
            }
            
            consoleBox.innerHTML += msg + "<br>";
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function clearScreen() {
            consoleBox.innerHTML = "[*] Screen cleared.<br><br>";
        }
    </script>

</body>
</html>
